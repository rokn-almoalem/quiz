<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ef7d3b">
<title>اختبار — ركن المعلم</title>
<style>
:root{
  --bg:#eef1f5;--card:#fff;--line:#dde4ec;--ink:#16263d;--muted:#6b7c8f;
  --green:#3d8268;--green2:#2a9d8f;--orange:#ef7d3b;--red:#e05b4a;--soft:#f3f6fa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow-wrap:anywhere}
.w{max-width:600px;margin:0 auto;padding:16px}
.br{display:flex;align-items:center;gap:10px;padding:2px 2px 12px}
.lg{width:38px;height:38px;border-radius:11px;background:radial-gradient(circle at 30% 30%,#f5a463,#ef7d3b);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 11px rgba(239,123,59,.35)}
.br .t1{font-weight:800;font-size:15px}.br .t2{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(22,38,61,.06);padding:18px;margin-bottom:14px}
h1{font-size:21px;font-weight:800;margin:0 0 6px}
.meta{color:var(--muted);font-size:13px}
.meta b{color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 4px}
.stat{background:var(--soft);border:1px solid #e2e8f0;border-radius:11px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--green2)}
.stat span{font-size:11px;color:var(--muted)}
label{font-weight:700;font-size:13px;display:block;margin:14px 0 6px}
select,input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.btn{width:100%;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:15px;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--green),var(--green2));cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.55;cursor:default}
.btn.dark{background:var(--ink)}
.btn.orange{background:var(--orange);color:#1a1200}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px}
.row .btn{margin-top:0}
.prog{height:8px;border-radius:6px;background:#e2e8f0;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2));transition:width .25s}
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chip{font-size:12px;font-weight:800;color:var(--green2);background:#e7f5f3;border-radius:20px;padding:3px 10px}
.qn{font-size:12px;color:var(--muted);font-weight:700}
.qtext{font-size:18px;font-weight:700;margin:6px 0 14px;line-height:1.7}
.opt{display:block;width:100%;text-align:right;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink);cursor:pointer;margin-bottom:10px;transition:.15s}
.opt:hover{border-color:var(--green2)}
.opt.sel{border-color:var(--green2);background:#e7f5f3;font-weight:800}
.opt .mk{float:left;color:var(--green2);font-weight:800;opacity:0;transition:.15s}
.opt.sel .mk{opacity:1}
.passage{background:var(--soft);border:1px solid #e2e8f0;border-right:4px solid var(--orange);border-radius:12px;padding:14px;font-size:16px;line-height:1.9;margin-bottom:6px;white-space:pre-wrap}
.big{text-align:center;padding:8px 0}
.score{font-size:44px;font-weight:800;color:var(--green2);line-height:1.1}
.score small{font-size:20px;color:var(--muted);font-weight:700}
.pct{display:inline-block;font-weight:800;font-size:14px;padding:3px 12px;border-radius:20px;margin-top:8px}
.pg{background:#e7f5f3;color:var(--green2)}.po{background:#fdf0e3;color:#c17a3a}.pr{background:#fde8e4;color:var(--red)}
.skrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #eef2f6}
.skrow .n{flex:1;font-weight:700;font-size:14px}
.bar{flex:0 0 84px;height:9px;border-radius:6px;background:#e2e8f0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.note{font-size:13px;border-radius:11px;padding:11px 12px;margin-top:12px;line-height:1.7}
.note.ok{background:#e7f5f3;color:#1e6b58;border:1px solid #bfe6dc}
.note.warn{background:#fdf0e3;color:#8a5a1e;border:1px solid #f3d9b8}
.note.err{background:#fde8e4;color:#a5332a;border:1px solid #f3c9c2}
.center{text-align:center}
.emoji{font-size:40px;text-align:center;margin-bottom:6px}
.spin{width:34px;height:34px;border:4px solid #e2e8f0;border-top-color:var(--green2);border-radius:50%;animation:sp .8s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}
:focus-visible{outline:3px solid rgba(42,157,143,.5);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="w">
  <div class="br"><div class="lg">📚</div><div><div class="t1">ركن المعلم</div><div class="t2">اختبار إلكتروني</div></div></div>
  <div id="app"></div>
</div>

<script>
/* ===== إعداد القاعدة (Firestore REST) — نفس مشروع تطبيقك ===== */
var KEY="AIzaSyCc99_No-Jly01WpO5jKYbIO0WPApJBLpM";
var PROJECT="rokn-almoalem";
var BASE="https://firestore.googleapis.com/v1/projects/"+PROJECT+"/databases/(default)/documents";

/* ===== أدوات ===== */
function $(id){return document.getElementById(id);}
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function app(html){$('app').innerHTML=html;window.scrollTo(0,0);}

/* ===== فكّ الاختبار من الرابط (#) — للروابط القديمة ===== */
function decodeExam(){
  var h=location.hash.slice(1);
  if(!h) return null;
  try{
    var b64=h.replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length%4) b64+='=';
    var json=decodeURIComponent(escape(atob(b64)));
    return JSON.parse(json);
  }catch(e){ return null; }
}

/* ===== v2: الاختبار المشفّر — المفتاح يأتي في #k= ولا يصل الخادم أبداً ===== */
var V2=false;
function _hashParam(n){ var m=new RegExp('[#&]'+n+'=([^&]+)').exec(location.hash); return m?decodeURIComponent(m[1]):''; }
function _b64uBytes(s){
  s=String(s).replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
  var bin=atob(s), a=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}
function _decryptPack(o){
  var kRaw=_hashParam('k');
  if(!kRaw) return Promise.reject(new Error('الرابط ناقص — انسخه كاملاً كما أُرسل'));
  if(!(window.crypto&&window.crypto.subtle)) return Promise.reject(new Error('المتصفّح لا يدعم فتح هذا الاختبار'));
  var kb,ivb,ctb;
  try{ kb=_b64uBytes(kRaw); ivb=_b64uBytes(o.iv); ctb=_b64uBytes(o.ct); }
  catch(e){ return Promise.reject(new Error('الرابط غير صحيح — تأكد أنك نسخته كاملاً كما أُرسل')); }
  return crypto.subtle.importKey('raw',kb,{name:'AES-GCM'},false,['decrypt'])
    .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM',iv:ivb},k,ctb); })
    .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); })
    .catch(function(){ throw new Error('تعذّر فتح الاختبار — الرابط غير مكتمل أو غير صحيح'); });
}
/* يقبل الصيغتين: {v:2,iv,ct} مشفّرة — أو الحزمة القديمة المكشوفة */
function openPayload(pl){
  var o;
  try{ o=JSON.parse(pl); }catch(e){ return Promise.reject(new Error('بيانات الاختبار تالفة')); }
  if(o && o.v===2 && o.ct && o.iv){ return _decryptPack(o).then(function(p){ V2=true; return p; }); }
  V2=false; return Promise.resolve(o);
}

var EX=null, ID=null, Q=[], isF=false, DL=0, STU="الطالب", TCHR="المعلّم", GRADABLE=[], TOTAL=0, SKILLS=[];
var state={name:'',idx:-1,answers:{},i:0};
function boot(exObj){
  EX=exObj; ID=EX&&EX.id; Q=(EX&&EX.k)||[]; isF=EX&&EX.tf===1; DL=(EX&&EX.dl)||0;
  STU=isF?"الطالبة":"الطالب"; TCHR=isF?"المعلّمة":"المعلّم";
  GRADABLE=Q.filter(function(q){return q[0]===0||q[0]===1;});
  TOTAL=GRADABLE.reduce(function(a,q){return a+(Number(q[4])||1);},0);
  SKILLS=(function(){var o={};GRADABLE.forEach(function(q){var n=(q[5]||'').trim()||'عام';o[n]=1;});return Object.keys(o);})();
  if(!EX||!ID||!Q.length){ screenNoExam(); }
  else if(DL && Date.now()>DL){ screenExpired(); }
  else{ screenIntro(); }
}
function getParam(n){ var m=new RegExp('[?&]'+n+'=([^&#]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }

/* ===== الشاشات ===== */
function screenNoExam(){
  app('<div class="card center"><div class="emoji">🔗</div>'
    +'<h1>لا يوجد اختبار</h1>'
    +'<p class="meta">افتح الرابط الذي أرسله لك '+TCHR+'.</p>'
    +'</div>');
}

function screenIntro(){
  var opts='<option value="">— اختر اسمك —</option>';
  ((EX.s)||[]).forEach(function(n){opts+='<option value="'+E(n)+'">'+E(n)+'</option>';});
  app('<div class="card">'
    +(EX.g?'<div class="meta" style="margin-bottom:2px">🏫 '+E(EX.g)+'</div>':'')
    +'<h1>'+E(EX.ti||'اختبار')+'</h1>'
    +'<div class="meta">'
      +(EX.su?'📖 '+E(EX.su)+' · ':'')
      +(EX.c?E(EX.c)+' · ':'')
      +'👤 '+TCHR+': <b>'+E(EX.te||'—')+'</b></div>'
    +'<div class="grid">'
      +'<div class="stat"><b>'+GRADABLE.length+'</b><span>سؤال</span></div>'
      +'<div class="stat"><b>'+TOTAL+'</b><span>الدرجة الكلية</span></div>'
      +'<div class="stat"><b>'+SKILLS.length+'</b><span>مهارة</span></div>'
    +'</div>'
    +'<label for="who">اختر اسمك من القائمة</label>'
    +'<select id="who">'+opts+'</select>'
    +'<button class="btn" id="start">ابدأ الاختبار ✍️</button>'
    +(DL?('<div class="note ok">⏰ ينتهي الاختبار: <b>'+new Date(DL).toLocaleString('ar')+'</b></div>'):'')
    +'<div class="note warn">⚠️ بعد التسليم يُقفل اسمك نهائياً ولا يمكن إعادة الحل. تأكّد أنه اسمك.</div>'
    +'</div>');
  $('start').onclick=function(){
    var v=$('who').value;
    if(!v){ toastInline('اختر اسمك أولاً'); return; }
    state.name=v;
    state.idx=((EX.s)||[]).indexOf(v);   // رقمه في كشف الجولة — هو ما يُرسل بدل الاسم
    /* في الوضع المشفّر لا نسمح إطلاقاً بإرسال الاسم الصريح لو تعذّر إيجاد الرقم */
    if(V2 && state.idx<0){ toastInline('تعذّر التعرّف على اسمك — أعد فتح الرابط كاملاً'); return; }
    checkNameThenConfirm();
  };
}

function toastInline(msg){
  var n=document.createElement('div');
  n.className='note err';n.style.marginTop='10px';n.textContent=msg;
  $('who').parentNode.insertBefore(n,$('start'));
  setTimeout(function(){n.remove();},2500);
}

function checkNameThenConfirm(){
  if(DL && Date.now()>DL){ screenExpired(); return; }
  var b=$('start'); b.disabled=true; b.textContent='جاري التحقق…';
  nameTaken(myDocKey()).then(function(taken){
    if(taken){ screenLocked(); return; }
    screenConfirm();
  }).catch(function(){ screenConfirm(); });
}

function screenLocked(){
  app('<div class="card center"><div class="emoji">🔒</div>'
    +'<h1>هذا الاسم سلّم من قبل</h1>'
    +'<p class="meta">الاسم «'+E(state.name)+'» أنهى هذا الاختبار مسبقاً، ولا يمكن إعادة الحل به. إن كان هذا خطأ، راجع '+TCHR+'.</p>'
    +'<button class="btn ghost" onclick="location.reload()">رجوع للأسماء</button>'
    +'</div>');
}

function screenConfirm(){
  app('<div class="card center"><div class="emoji">👋</div>'
    +'<h1>هل أنت '+E(state.name)+'؟</h1>'
    +'<p class="meta">بعد التسليم يُقفل اسمك ولا يمكن إعادة الحل. تأكّد قبل أن تبدأ.</p>'
    +'<button class="btn" id="go">نعم، ابدأ</button>'
    +'<button class="btn ghost" onclick="location.reload()">تغيير الاسم</button>'
    +'</div>');
  $('go').onclick=function(){ state.i=0; renderQ(); startTimer(); };
}

function renderQ(){
  var q=Q[state.i];
  var type=q[0];
  var answered=GRADABLE.filter(function(g){var idx=Q.indexOf(g);return state.answers[idx]!=null;}).length;
  var pct=GRADABLE.length?Math.round(answered/GRADABLE.length*100):0;
  var body='';
  var human=humanNumber(state.i);
  var top='<div class="prog"><i style="width:'+pct+'%"></i></div>'
    +'<div class="qtop"><span class="qn">'+(human?('السؤال '+human+' من '+GRADABLE.length):'قراءة')+'</span>'
    +(q[5]?'<span class="chip">'+E(q[5])+'</span>':'')+'</div>';

  if(type===2){
    body='<div class="passage">'+E(q[1])+'</div>';
  } else if(type===0){
    body='<div class="qtext">'+E(q[1])+'</div>'
      +optBtn(1,'✔️ صح')+optBtn(0,'❌ خطأ');
  } else if(type===1){
    body='<div class="qtext">'+E(q[1])+'</div>';
    var options=q[2]||[];
    options.forEach(function(op,k){ body+=optBtn(k,E(op)); });
  }

  var isLast=state.i>=Q.length-1;
  var nav='<div class="row" style="margin-top:16px">'
    +(state.i>0?'<button class="btn ghost" id="prev">‹ السابق</button>':'')
    +(isLast
       ? '<button class="btn orange" id="submit">تسليم الاختبار</button>'
       : '<button class="btn" id="next">التالي ›</button>')
    +'</div>';

  app('<div class="card">'+top+body+nav+'</div>');

  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(el){
    el.onclick=function(){
      state.answers[state.i]=Number(el.getAttribute('data-v'));
      renderQ();
    };
  });
  if($('prev')) $('prev').onclick=function(){ state.i--; renderQ(); };
  if($('next')) $('next').onclick=function(){ state.i++; renderQ(); };
  if($('submit')) $('submit').onclick=trySubmit;
}

function optBtn(val,label){
  var sel=state.answers[state.i]===val?' sel':'';
  return '<button class="opt'+sel+'" data-v="'+val+'"><span class="mk">✓</span>'+label+'</button>';
}
function humanNumber(idx){
  if(Q[idx][0]===2) return 0;
  var n=0;
  for(var j=0;j<=idx;j++){ if(Q[j][0]!==2) n++; }
  return n;
}

var _submitted=false, _timerInt=null;
function trySubmit(){
  var unanswered=GRADABLE.filter(function(g){var idx=Q.indexOf(g);return state.answers[idx]==null;}).length;
  if(unanswered>0){
    if(!confirm('لديك '+unanswered+' سؤال بدون إجابة (تُحتسب خطأ). هل تريد التسليم؟')) return;
  }
  doSubmit();
}
function autoSubmit(){
  if(_submitted) return;
  alert('انتهى وقت الاختبار — سيتم تسليم إجاباتك الآن.');
  doSubmit();
}
function doSubmit(){
  if(_submitted) return; _submitted=true; stopTimer();
  var res=grade();
  screenSending();
  sendResult(res).then(function(){
    screenDone(res,true,'');
  }).catch(function(err){
    screenDone(res,false,String(err&&err.message||err));
  });
}
function fmt(ms){ if(ms<0)ms=0; var s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60); s=s%60; m=m%60; return (h>0?(h+':'):'')+((h>0&&m<10)?'0':'')+m+':'+(s<10?'0':'')+s; }
function startTimer(){
  if(!DL) return;
  var bar=document.getElementById('qzTimer');
  if(!bar){ bar=document.createElement('div'); bar.id='qzTimer';
    bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;text-align:center;font-family:inherit;font-weight:800;font-size:14px;padding:8px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)';
    document.body.appendChild(bar);
    var w=document.querySelector('.w'); if(w) w.style.paddingTop='46px';
  }
  function tick(){
    var rem=DL-Date.now();
    if(rem<=0){ stopTimer(); autoSubmit(); return; }
    var warn=rem<=5*60*1000;
    bar.style.background=warn?'#e05b4a':'#2a9d8f';
    bar.textContent=(warn?'⚠️ باقٍ ':'⏱️ متبقّي ')+fmt(rem)+(warn?' — سيُسلَّم تلقائياً':'');
  }
  tick(); _timerInt=setInterval(tick,1000);
}
function stopTimer(){ if(_timerInt){clearInterval(_timerInt);_timerInt=null;} var b=document.getElementById('qzTimer'); if(b)b.remove(); var w=document.querySelector('.w'); if(w) w.style.paddingTop=''; }
function screenExpired(){
  app('<div class="card center"><div class="emoji">⏰</div>'
    +'<h1>انتهى وقت الاختبار</h1>'
    +'<p class="meta">أُقفل هذا الاختبار ولم يعد بالإمكان حلّه. للاستفسار راجع '+TCHR+'.</p>'
    +'</div>');
}

/* ===== التصحيح ===== */
function grade(){
  var earned=0,sk={};
  Q.forEach(function(q,i){
    var type=q[0];
    if(type!==0&&type!==1) return;
    var mark=Number(q[4])||1;
    var name=(q[5]||'').trim()||'عام';
    if(!sk[name]) sk[name]={got:0,max:0};
    sk[name].max+=mark;
    var correct=(Number(q[3])===Number(state.answers[i]));
    if(correct){ earned+=mark; sk[name].got+=mark; }
  });
  var skills=Object.keys(sk).map(function(n){return {name:n,got:sk[n].got,max:sk[n].max};});
  return { name:state.name, earned:earned, total:TOTAL, skills:skills };
}

/* ===== القاعدة: تحقق من الاسم + رفع النتيجة ===== */
function numF(n){ return {doubleValue:Number(n)||0}; }
function toFields(p){
  var f={
    earned:numF(p.earned),
    total:numF(p.total),
    ts:{timestampValue:new Date().toISOString()}
  };
  if(V2 && state.idx>=0){
    /* v2: أرقام فقط — لا اسم طالب ولا اسم مهارة يصل الخادم */
    f.i=numF(state.idx);
    f.skills={arrayValue:{values:(p.skills||[]).map(function(s){
      return {mapValue:{fields:{ i:numF(SKILLS.indexOf(s.name)), got:numF(s.got), max:numF(s.max) }}};
    })}};
  } else {
    f.name={stringValue:String(p.name)};
    f.skills={arrayValue:{values:(p.skills||[]).map(function(s){
      return {mapValue:{fields:{ name:{stringValue:String(s.name)}, got:numF(s.got), max:numF(s.max) }}};
    })}};
  }
  return { fields:f };
}
function docUrl(key){
  return BASE+'/exams/'+encodeURIComponent(ID)+'/results/'+encodeURIComponent(key)+'?key='+KEY;
}
/* في v2 يصير المعرّف s<رقم> فلا يظهر اسم الطالب في القاعدة إطلاقاً */
function myDocKey(){ return (V2 && state.idx>=0) ? ('s'+state.idx) : state.name; }
function nameTaken(name){
  return fetch(docUrl(name)).then(function(r){
    if(r.status===200) return r.json().then(function(j){return !!(j&&j.fields);});
    return false;
  });
}
function sendResult(p){
  return fetch(docUrl(myDocKey()),{
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(toFields(p))
  }).then(function(r){
    if(r.ok) return true;
    return r.json().catch(function(){return {};}).then(function(j){
      throw new Error((j&&j.error&&j.error.message)||('HTTP '+r.status));
    });
  });
}

/* ===== شاشات النهاية ===== */
function screenSending(){
  app('<div class="card center"><div class="spin"></div>'
    +'<h1>جاري إرسال نتيجتك…</h1><p class="meta">لحظات من فضلك</p></div>');
}

function screenDone(res,ok,errMsg){
  var pct=res.total?Math.round(res.earned/res.total*100):0;
  var cls=pct>=75?'pg':(pct>=50?'po':'pr');
  var sk=res.skills.map(function(s){
    var p=s.max?Math.round(s.got/s.max*100):0;var g=p>=60;
    return '<div class="skrow"><span>'+(g?'🟢':'🔴')+'</span>'
      +'<span class="n">'+E(s.name)+'</span>'
      +'<span class="bar"><i style="width:'+p+'%;background:'+(g?'#2a9d8f':'#e05b4a')+'"></i></span>'
      +'<span style="font-weight:800;font-size:13px;width:44px;text-align:left;color:'+(g?'#2a9d8f':'#e05b4a')+'">'+s.got+'/'+s.max+'</span></div>';
  }).join('');
  app('<div class="card center"><div class="emoji">'+(ok?'✅':'📄')+'</div>'
      +'<h1>'+(ok?'تم تسليم اختبارك':'انتهى اختبارك')+'</h1>'
      +'<div class="big"><div class="score">'+res.earned+'<small>/'+res.total+'</small></div>'
      +'<div class="pct '+cls+'">'+pct+'%</div></div>'
      +(ok?'<div class="note ok">📤 وصلت نتيجتك إلى '+TCHR+'.</div>'
          :'<div class="note err">⚠️ لم تُرسل النتيجة تلقائياً. أبلغ '+TCHR+' بدرجتك أعلاه.<br><span style="font-size:11px;opacity:.8">('+E(errMsg)+')</span></div>')
      +'</div>'
    + (res.skills.length?('<div class="card"><h1 style="font-size:16px">📊 أداؤك في المهارات</h1>'+sk+'</div>'):'')
    + (ok?'':'<div class="card"><button class="btn ghost" id="retry">إعادة محاولة الإرسال</button></div>')
  );
  if($('retry')) $('retry').onclick=function(){
    screenSending();
    sendResult(res).then(function(){screenDone(res,true,'');}).catch(function(e){screenDone(res,false,String(e&&e.message||e));});
  };
}

/* ===== تشغيل: رابط قصير (?e=) من القاعدة، أو رابط قديم (#) ===== */
var _eid=getParam('e');
if(_eid){
  app('<div class="card center"><div class="spin"></div><h1>جاري تحميل الاختبار…</h1><p class="meta">لحظات من فضلك</p></div>');
  fetch(BASE+'/exams/'+encodeURIComponent(_eid)+'?key='+KEY).then(function(r){return r.json();}).then(function(j){
    if(j&&j.error) throw new Error(j.error.message||'خطأ');
    var pl=j.fields&&j.fields.payload&&j.fields.payload.stringValue;
    if(!pl) throw new Error('الاختبار غير موجود');
    return openPayload(pl).then(boot);
  }).catch(function(e){
    app('<div class="card center"><div class="emoji">⚠️</div><h1>تعذّر تحميل الاختبار</h1><p class="meta">تأكد من اتصال الإنترنت ثم أعد فتح الرابط.<br><span style="font-size:11px;opacity:.7">('+E(String(e&&e.message||e))+')</span></p></div>');
  });
} else {
  var _ex=decodeExam();
  if(_ex) boot(_ex); else screenNoExam();
}
</script>
