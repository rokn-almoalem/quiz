<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3d8268"><title>نتائج الاختبار — ركن المعلم</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:#eef1f5;color:#16263d;line-height:1.55}
.w{max-width:820px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid #dde4ec;border-radius:16px;box-shadow:0 4px 18px rgba(22,38,61,.06);padding:16px;margin-bottom:12px}
h1{font-size:19px;font-weight:800;margin:0 0 4px}
h2{font-size:15px;font-weight:800;margin:0 0 10px;color:#3d8268}
.mut{color:#6b7c8f;font-size:13px}
input{width:100%;padding:12px;border:1.5px solid #dde4ec;border-radius:10px;font-size:16px;font-family:inherit;text-align:center;margin:10px 0}
.btn{width:100%;border:none;border-radius:11px;padding:14px;font-weight:800;font-size:15px;font-family:inherit;color:#fff;background:linear-gradient(135deg,#3d8268,#2a9d8f);cursor:pointer}
.btn2{background:#16263d}.btn3{background:#ef7d3b;color:#1a1200}
.err{color:#c0392b;text-align:center;padding:12px}
.br{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
.lg{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#3d8268,#2a9d8f);display:flex;align-items:center;justify-content:center;font-size:18px}
.sheet{background:#fff;border:1px solid #dde4ec;border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px rgba(22,38,61,.06)}
.rhead{border:2px solid #16263d;border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.rhead .ico{width:52px;height:52px;flex:0 0 auto;border-radius:12px;background:linear-gradient(135deg,#3d8268,#2a9d8f);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff}
.rhead .ht{flex:1;min-width:0}
.rhead .title{font-size:20px;font-weight:800;margin:0 0 3px}
.rhead .sub{font-size:13px;color:#41526a;line-height:1.7}
.rhead .sub b{color:#16263d}
.sumrow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.st{background:#f3f6fa;border:1px solid #e2e8f0;border-radius:10px;padding:8px 4px;text-align:center}
.st b{display:block;font-size:17px;color:#2a9d8f;line-height:1.2}
.st.o b{color:#c17a3a}.st.r b{color:#e05b4a}
.st span{font-size:10px;color:#6b7c8f}
.weaknote{margin:10px 0 2px;background:#fdf0e3;border:1px solid #f3d9b8;border-radius:9px;padding:9px 11px;font-size:12.5px;color:#8a5a1e}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{display:table-header-group}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid #eef2f6}
th{color:#516074;font-size:11.5px;font-weight:800;background:#f7f9fc;border-bottom:2px solid #e2e8f0}
td.c,th.c{text-align:center}
tr{page-break-inside:avoid}
tbody tr:nth-child(even){background:#fafcfe}
.pill{display:inline-block;font-weight:800;font-size:12px;padding:1px 8px;border-radius:20px}
.pg{background:#e7f5f3;color:#2a9d8f}.pr{background:#fde8e4;color:#e05b4a}.po{background:#fdf0e3;color:#c17a3a}
.rank{color:#94a3b4;font-weight:700}
.weak{font-size:11.5px;color:#c17a3a}
.chartpage{page-break-before:always}
.avgbig{text-align:center;background:linear-gradient(135deg,#eef7f4,#e7f5f3);border:1px solid #cfe9e1;border-radius:12px;padding:14px;margin-bottom:16px}
.avgbig .n{font-size:40px;font-weight:800;color:#2a9d8f;line-height:1}
.avgbig .l{font-size:12px;color:#4a6a60;font-weight:700}
.skb{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eef2f6}
.skb .nm{flex:0 0 130px;font-weight:700;font-size:13px}
.skb .track{flex:1;height:16px;border-radius:8px;background:#eef2f6;overflow:hidden;position:relative}
.skb .fill{height:100%;border-radius:8px}
.skb .pc{flex:0 0 46px;text-align:left;font-weight:800;font-size:13px}
.dist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.dist .db{border-radius:11px;padding:12px;text-align:center;color:#fff}
.dist .db b{display:block;font-size:24px;line-height:1.1}
.dist .db span{font-size:11px;opacity:.95}
@media print{
  @page{size:A4;margin:11mm}
  body{background:#fff}
  .noprint{display:none!important}
  .w{max-width:none;padding:0}
  .sheet{box-shadow:none;border:none;border-radius:0;padding:0;margin:0}
  .st b{font-size:16px}
}
</style></head><body>
<div class="w">
<div class="br noprint"><div class="lg">📊</div><div><div style="font-weight:800;font-size:15px">ركن المعلم</div><div style="font-size:11px;color:#6b7c8f">نتائج وتحليل الاختبار</div></div></div>
<div class="card noprint" id="inp">
<h1>📊 نتائج الاختبار الإلكتروني</h1>
<div class="mut">أدخل رقم الاختبار لعرض التقرير الكامل (كشف + تحليل + رسم بياني).</div>
<input id="eid" placeholder="رقم الاختبار (مثال: qmr...)">
<button class="btn" id="go">🔄 عرض النتائج</button>
</div>
<div id="out"></div>
</div>
<script>
var FB={apiKey:"AIzaSyCc99_No-Jly01WpO5jKYbIO0WPApJBLpM",projectId:"rokn-almoalem"};
function $(i){return document.getElementById(i)}
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function _n(v){if(!v)return 0;return parseFloat(v.integerValue||v.doubleValue||0)||0}
function _s(v){return (v&&v.stringValue)||""}
function _arr(v){var a=[];if(v&&v.arrayValue&&v.arrayValue.values){v.arrayValue.values.forEach(function(x){if(x.mapValue&&x.mapValue.fields){var F=x.mapValue.fields;a.push({name:_s(F.name),got:_n(F.got),max:_n(F.max)})}})}return a}
function decodeHash(){
  var h=location.hash.slice(1);
  if(!h) return {id:"",meta:null};
  try{
    var b64=h.replace(/-/g,'+').replace(/_/g,'/'); while(b64.length%4)b64+='=';
    var o=JSON.parse(decodeURIComponent(escape(atob(b64))));
    if(o && o.i) return {id:String(o.i),meta:o};
  }catch(e){}
  return {id:decodeURIComponent(h),meta:null};
}
var HASH=decodeHash();
var META=HASH.meta;
if(HASH.id){ $('eid').value=HASH.id; }
$('go').onclick=function(){ META=null; fetchR($('eid').value); };
function fetchR(id){
  id=(id||"").trim(); if(!id){ $('out').innerHTML='<div class="card err">اكتب رقم الاختبار أولاً</div>'; return; }
  $('out').innerHTML='<div class="card mut" style="text-align:center">⏳ جاري الجلب…</div>';
  var url="https://firestore.googleapis.com/v1/projects/"+FB.projectId+"/databases/(default)/documents/exams/"+encodeURIComponent(id)+"/results?key="+FB.apiKey+"&pageSize=300";
  fetch(url).then(function(r){return r.json()}).then(function(j){
    if(j&&j.error) throw new Error(j.error.message||"خطأ");
    var R=(j.documents||[]).map(function(d){var f=d.fields||{};return{name:_s(f.name)||d.name.split("/").pop(),earned:_n(f.earned),total:_n(f.total),skills:_arr(f.skills)}});
    render(R);
  }).catch(function(e){ $('out').innerHTML='<div class="card err">تعذّر الجلب: '+E(String(e&&e.message||e))+'<br><span style="font-size:11px;color:#6b7c8f">تأكد من رقم الاختبار والإنترنت</span></div>'; });
}
function pill(p){var c=p>=75?'pg':(p>=50?'po':'pr');return '<span class="pill '+c+'">'+p+'%</span>';}
function render(R){
  if(!R.length){ $('out').innerHTML='<div class="card" style="text-align:center;color:#6b7c8f">لا نتائج بعد — لم يسلّم أحد.</div>'; $('inp').style.display=''; return; }
  R.sort(function(a,b){return b.earned/(b.total||1) - a.earned/(a.total||1)});
  var tot=R[0].total||0;
  var pcts=R.map(function(r){return r.total?r.earned/r.total*100:0});
  var avg=Math.round(pcts.reduce(function(a,b){return a+b},0)/R.length);
  var pass=pcts.filter(function(p){return p>=50}).length;
  var hi=Math.max.apply(null,R.map(function(r){return r.earned})), lo=Math.min.apply(null,R.map(function(r){return r.earned}));
  var skAgg={};
  R.forEach(function(r){ r.skills.forEach(function(s){ if(!skAgg[s.name])skAgg[s.name]={got:0,max:0}; skAgg[s.name].got+=s.got; skAgg[s.name].max+=s.max; }); });
  var skNames=Object.keys(skAgg);
  var weakest=null; skNames.forEach(function(n){var p=skAgg[n].max?skAgg[n].got/skAgg[n].max*100:100; if(weakest===null||p<weakest.p)weakest={n:n,p:Math.round(p)};});
  var dExc=pcts.filter(function(p){return p>=75}).length;
  var dGood=pcts.filter(function(p){return p>=50&&p<75}).length;
  var dLow=pcts.filter(function(p){return p<50}).length;
  var isF=META&&(META.f===1||META.f===true);
  var tLabel=isF?"المعلّمة":"المعلّم";
  var title=(META&&META.t)||"نتائج الاختبار";
  var subLine=[];
  if(META){ if(META.o)subLine.push('🏫 '+E(META.o)); if(META.s)subLine.push('📖 '+E(META.s)); if(META.c)subLine.push('🏷️ '+E(META.c)); if(META.e)subLine.push('👤 '+tLabel+': <b>'+E(META.e)+'</b>'); }
  var head='<div class="rhead"><div class="ico">📊</div><div class="ht">'
    +'<div class="title">'+E(title)+'</div>'
    +'<div class="sub">'+(subLine.length?subLine.join(' &nbsp;•&nbsp; '):'تقرير نتائج الاختبار الإلكتروني')+'</div>'
    +'</div></div>';
  var summary='<div class="sumrow">'
    +'<div class="st"><b>'+R.length+'</b><span>عدد '+(isF?'الطالبات':'الطلاب')+'</span></div>'
    +'<div class="st"><b>'+avg+'%</b><span>المتوسط</span></div>'
    +'<div class="st '+(pass===R.length?'':'o')+'"><b>'+pass+'/'+R.length+'</b><span>ناجح</span></div>'
    +'<div class="st"><b>'+hi+'</b><span>أعلى درجة</span></div>'
    +'<div class="st r"><b>'+lo+'</b><span>أقل درجة</span></div>'
    +'<div class="st"><b>'+tot+'</b><span>الدرجة الكلية</span></div>'
    +'</div>'
    +(weakest?'<div class="weaknote">🔴 المهارة الأضعف على الصف: <b>'+E(weakest.n)+'</b> ('+weakest.p+'%) — تحتاج إعادة شرح.</div>':'');
  var rows=R.map(function(r,i){
    var p=r.total?Math.round(r.earned/r.total*100):0;
    var weak=r.skills.filter(function(s){return s.max&&s.got/s.max<0.5}).map(function(s){return s.name});
    return '<tr><td class="c rank">'+(i+1)+'</td><td>'+E(r.name)+'</td>'
      +'<td class="c" style="font-weight:800;color:#2a9d8f">'+r.earned+'/'+r.total+'</td>'
      +'<td class="c">'+pill(p)+'</td>'
      +'<td class="weak">'+(weak.length?E(weak.join("، ")):'—')+'</td></tr>';
  }).join("");
  var tableCard='<div class="sheet">'+head
    +'<h2>📈 ملخّص الصف</h2>'+summary
    +'<h2 style="margin-top:16px">🖊️ كشف الدرجات والمهارات</h2>'
    +'<table><thead><tr><th class="c">م</th><th>الاسم</th><th class="c">الدرجة</th><th class="c">النسبة</th><th>مهارات تحتاج دعم</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'</div>';
  var maxBars=skNames.map(function(n){var s=skAgg[n];return s.max?Math.round(s.got/s.max*100):0;});
  var skb=skNames.map(function(n,idx){
    var p=maxBars[idx];var g=p>=60;
    return '<div class="skb"><span class="nm">'+E(n)+'</span>'
      +'<span class="track"><span class="fill" style="width:'+p+'%;background:'+(g?'linear-gradient(90deg,#3d8268,#2a9d8f)':'linear-gradient(90deg,#e05b4a,#f0836f)')+'"></span></span>'
      +'<span class="pc" style="color:'+(g?'#2a9d8f':'#e05b4a')+'">'+p+'%</span></div>';
  }).join("");
  var chartCard='<div class="sheet chartpage">'+head
    +'<h2>🎯 تحليل مهارات الصف</h2>'
    +'<div class="avgbig"><div class="n">'+avg+'%</div><div class="l">متوسط الصف العام</div></div>'
    +skb
    +'<div class="dist">'
      +'<div class="db" style="background:#2a9d8f"><b>'+dExc+'</b><span>ممتاز (٧٥%+)</span></div>'
      +'<div class="db" style="background:#c17a3a"><b>'+dGood+'</b><span>جيد (٥٠–٧٤%)</span></div>'
      +'<div class="db" style="background:#e05b4a"><b>'+dLow+'</b><span>يحتاج دعم (أقل من ٥٠%)</span></div>'
    +'</div>'
    +'</div>';
  var actions='<div class="card noprint"><button class="btn btn3" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>'
    +'<button class="btn btn2" style="margin-top:8px" onclick="location.hash=\'\';location.reload()">🔄 اختبار آخر</button></div>';
  $('out').innerHTML=tableCard+chartCard+actions;
  $('inp').style.display='none';
}
if(HASH.id) fetchR(HASH.id);
</script></body></html>
